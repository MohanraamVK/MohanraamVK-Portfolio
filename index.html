    <script>
      // set theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        if (t === "light") document.documentElement.classList.add("light");
      } catch (e) {}
    </script>
